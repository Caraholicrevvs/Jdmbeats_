<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RevSpec — Global Automotive Database</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08090d;--panel:#151820;--line:#272b35;--muted:#9299a8;--text:#f5f7fb}
body{background:radial-gradient(circle at 15% 0%,#1a1d27 0,transparent 30%),radial-gradient(circle at 90% 10%,#171a22 0,transparent 25%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:20;backdrop-filter:blur(18px);background:rgba(8,9,13,.86);border-bottom:1px solid var(--line)}
.nav{max-width:1250px;margin:auto;padding:18px 22px;display:flex;justify-content:space-between}
.logo{font-weight:900;letter-spacing:3px;font-size:22px}.logo span{color:#ff3c1a}
.hero{max-width:1250px;margin:auto;padding:85px 22px 55px}
.hero h1{font-size:clamp(48px,8vw,92px);line-height:.9;letter-spacing:-5px}
.hero p{margin-top:20px;color:var(--muted);max-width:680px;line-height:1.7}
.stats{max-width:1250px;margin:0 auto 50px;padding:0 22px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:linear-gradient(145deg,#151821,#0e1015);border:1px solid var(--line);border-radius:18px;padding:22px}.stat strong{font-size:28px;display:block}
.section{max-width:1250px;margin:auto;padding:0 22px 65px}
.sectionhead{display:flex;justify-content:space-between;margin-bottom:18px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.input,.select{background:#101219;color:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;flex:1;min-width:180px;outline:none}
.letters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.l{width:36px;height:36px;border:1px solid var(--line);background:#101219;color:#aeb4c0;border-radius:10px;cursor:pointer}.l.active{background:#fff;color:#000}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.brand{min-height:155px;background:linear-gradient(145deg,#151820,#0d0f14);border:1px solid var(--line);border-radius:18px;padding:18px;position:relative;cursor:pointer;text-align:left;color:#fff}
.brand:hover{transform:translateY(-3px);border-color:#5b616d}
.blogo{width:54px;height:54px;background:#fff;border-radius:12px;padding:6px;object-fit:contain;display:block;margin-bottom:12px}
.count{position:absolute;right:12px;top:12px;font-size:11px;color:#7e8593}
.arrow{position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:50%;background:#1e2333;border:1px solid var(--line);display:grid;place-items:center}
.profile{border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#151820,#0d0f14);padding:24px;margin-bottom:50px}
.profiletop{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.plogo{width:88px;height:88px;background:#fff;border-radius:16px;padding:10px;object-fit:contain}
.cargrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.car{background:#101218;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.car img{width:100%;height:170px;object-fit:cover;background:#191c24}
.carbody{padding:12px}.carbody b{font-size:13px;display:block}.carbody small{color:var(--muted);font-size:11px}
.spec{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.spec span{font-size:9px;background:#171a21;border-radius:6px;padding:4px 6px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.cargrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid,.cargrid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">REV<span>SPEC</span></div><div id="cnt" style="color:var(--muted);font-size:12px"></div></div></header>
<main>
<section class="hero"><div style="font-size:11px;letter-spacing:3px;color:#9da4b2">GLOBAL AUTOMOTIVE DATABASE • 2026 • Wikipedia + Car.info</div><h1>Know the machine.</h1><p>400+ real world brands with current present-day models
