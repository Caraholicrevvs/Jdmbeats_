.brand-grid {

    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 18px;
}

.brand-card {
    background: #101010;
    border: 1px solid #252525;
    padding: 25px;
    border-radius: 12px;
    cursor: pointer;
    transition: .25s;
}

.brand-card:hover {
    transform: translateY(-5px);
    border-color: #e50909;
    background: #151515;

.brand-card h3 {
    font-size: 21px;

    color: #888;

.year {
    color: #e50909;

#brandDetails {
    display: none;
}

.brand-info {
    background: #101010;

    border-radius: 15px;
    border: 1px solid #292929;
}

.brand-info h2 {
    font-size: 40px;
    margin-bottom: 10px;
}

.brand-info .country-big {
    color: #e50909;
    margin-bottom: 20px;
}

.brand-info p {
    color: #aaa;
    line-height: 1.7;
    margin: 8px 0;
}

.model-search {

}
