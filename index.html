<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RevSpec — 400+ Brands | 12,000+ Models</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08090d;--card:#151821;--line:#252c3a;--text:#f5f7fb;--muted:#9aa3b5}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(8,9,13,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.nav{max-width:900px;margin:auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;letter-spacing:3px;font-size:22px}
.search{max-width:900px;margin:auto;padding:12px 20px;display:flex;gap:8px}
.input{flex:1;background:#12141d;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:#fff;outline:none}
.letters{max-width:900px;margin:auto;padding:0 20px 12px;display:flex;gap:6px;flex-wrap:wrap}
.l{width:34px;height:34px;border-radius:10px;background:#151821;border:1px solid var(--line);color:#aeb5c3;font-size:13px;cursor:pointer}
.l.active{background:#fff;color:#000}
.wrap{max-width:900px;margin:auto;padding:0 20px 90px;display:flex;flex-direction:column;gap:12px}
.brand{border:1px solid var(--line);background:linear-gradient(145deg,#181c29,#10131b);border-radius:20px;overflow:hidden}
.brand-top{display:flex;align-items:center;gap:14px;padding:18px;cursor:pointer}
.blogo{width:56px;height:56px;border-radius:14px;background:#fff;object-fit:contain;padding:7px;flex-shrink:0}
.binfo{flex:1}.binfo h3{color:#fff;font-size:17px;font-weight:700}.binfo small{color:var(--muted);font-size:12px}
.arrow{width:42px;height:42px;border-radius:50%;background:#1e2433;border:1px solid var(--line);display:grid;place-items:center;color:#fff;font-size:20px;transition:.25s;flex-shrink:0}
.brand.open .arrow{transform:rotate(90deg);background:#fff;color:#000}
.models{display:none;padding:0 12px 14px;grid-template-columns:repeat(2,1fr);gap:10px}
.brand.open .models{display:grid}
@media(max-width:600px){.models{grid-template-columns:1fr}}
.car{background:#0d0f16;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.car img{width:100%;height:155px;object-fit:cover;background:#1c212e;display:block}
.carbody{padding:10px}.carbody b{font-size:13px;color:#fff;display:block}.carbody p{font-size:10px;color:var(--muted);margin-top:3px}
.specs{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}.spec{font-size:9px;background:#1c2130;border-radius:7px;padding:5px 6px;color:#d1d8e6}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">REVSPEC.</div><div id="cnt" style="color:var(--muted);font-size:12px">Loading...</div></div></header>
<div class="search">
<input id="sBrand" class="input" placeholder="Search 400+ brands...">
<input id="sModel" class="input" placeholder="Search model...">
</div>
<div class="letters" id="letters"></div>
<div class="wrap" id="brandList"></div>
